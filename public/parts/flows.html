<ui-bind path="*plugins" config="template" class="block">
	<script type="text/html">
		{{ foreach m in value }}
			{{ if !m.hidden }}
			<ui-component name="page" path="*page" config="if:plugin{{ m.id }};url:@{#}/_{{ m.id }}/index.html;reload:?/reload;hidden:?/hide;id:_{{ m.id }}" class="hidden invisible"></ui-component>
			{{ if m.routes }}
				{{ foreach route in m.routes }}
				<ui-component name="page" path="*page" config="if:plugin{{ m.id }}{{ route.html }};url:@{#}/_{{ m.id }}/{{ route.html }}.html;reload:?/reload;hidden:?/hide;id:_{{ m.id }}" class="hidden invisible"></ui-component>
				{{ end }}
			{{ fi }}
			{{ fi }}
		{{ end }}
	</script>
</ui-bind>

<ui-bind path="*page" config="show:value === 'flows'" class="block">
	<ui-component name="viewbox" config="parent:window;scrollbar:1;scrollbarshadow:1;margin:90" class="invisible flows-viewbox" style="margin-right:64px">

		<ui-component name="empty" path="*groups" config="parent:auto" class="invisible">

			<script type="text/html">
				<div>@(This Total.js Flow application doesn't contain any FlowStream)</div>
				<div class="m b">@(Create something awesome)</div>
				<div style="max-width:220px;margin:0 auto;width:100%;padding:5px">
					<button class="exec button b" data-exec="common/create"><i class="ti ti-plus-circle mr5"></i>@(Create FlowStream)</button>
				</div>
			</script>

			<div>

				<div class="flow-listbar">
					<div>
						<div class="flow-listbar-title">@(FlowStreams)</div>
						<ui-bind path="common.items" config="text b:value ? value.length : 0" class="flow-listbar-count">@(Total running): <b></b></ui-bind>
					</div>
				</div>

				<ui-bind path="common.groups" config="template" class="flowstreams block">
					<script type="text/html">
						{{ foreach g in value }}
							<div class="flows">
								{{ if g.name }}<h2>{{ g.name }}</h2>{{ fi }}
								<div class="flow-list">
								{{ foreach m in g.items }}
								<figure class="exec exec3{{ if m.stats && m.stats.paused }} paused{{ fi }}" data-exec="common/open" data-id="{{ m.id }}" data-exec3="common/contextmenu">
									<section>
										<div class="flow-identity">
											<div class="icon"{{ if m.color }} style="background-color:{{ m.color }}"{{ fi }}><i class="{{ m.icon }}"></i></div>
											<div class="meta">
												<div class="name"><b>{{ m.name }}</b>{{ if m.version }}<span class="version" title="@(Version)">v{{ m.version }}</span>{{ fi }}{{ if m.stats && m.stats.errors }}<span class="flow-error-badge"><i class="ti ti-exclamation-triangle"></i>@(Error)</span>{{ fi }}</div>
												<div class="details">
													{{ if m.stats && m.stats.paused }}<span class="flow-status flow-status-paused"><i></i>@(Paused)</span>{{ else }}<span class="flow-status"><i></i>@(Running)</span>{{ fi }}
													{{ if m.reference }}<span class="reference">{{ m.reference }}</span>{{ fi }}
												</div>
											</div>
										</div>
										<div class="proxy">
											{{ if m.proxypath }}<i class="ti ti-link"></i><span title="{{ m.proxypath }}">{{ m.proxypath }}</span>{{ else }}<span class="empty">---</span>{{ fi }}
										</div>
										<div class="stats">
											<div><span class="memory-value" title="@(Memory usage)">{{ if m.stats }}{{ m.stats.memory | filesize }}{{ fi }}</span></div>
										</div>
										<div class="options exec" data-exec="common/contextmenu" data-prevent="true" title="@(Options)"><i class="ti ti-ellipsis-v"></i></div>
									</section>
								</figure>
								{{ end }}
								</div>
							</div>
						{{ end }}
					</script>
				</ui-bind>
			</div>
		</ui-component>
	</ui-component>
	<footer>
		<ui-bind path="*stats" config="template;show" class="hidden">
			<script type="text/html">
				<span><b>{{ value.memory | filesize }}</b>@(Memory)</span>
				<span><b>{{ value.messages | format(0) }}</b>@(Messages)</span>
				<span><b>{{ value.pending | format(0) }}</b>@(Pending)</span>
				<span><b>{{ value.mm | format(0) }}</b>@(Per minute)</span>
				<span><i class="ti ti-user green mr5"></i><b>{{ value.online | format(0) }}</b>@(Online clients)</span>
				<span class="center" title="FlowStream: {{ value.version }}, Total.js: {{ value.total }}, Flow: {{ value.app }}, Node.js: {{ value.node }}">Flow v{{ value.app }} | Total.js: v{{ value.total }}</span>
			</script>
		</ui-bind>
	</footer>
</ui-bind>

<script>
	EXTENSION('@common', function(exports) {

		var model = exports.model;

		exports.search = function(el) {
			var opt = {};
			opt.cache = false;
			opt.recent = false;
			opt.init = true;
			opt.clear = true;
			opt.search = function(value, next) {

				var output = [];

				value = value.toSearch();

				for (let item of model.items) {
					if (item.name.toSearch().indexOf(value) !== -1) {
						if (output.push({ id: item.id, name: item.name + '<span class="badge badge-color badge-medium ml5">@(FlowStream)</span>', icon: item.icon, color: item.color }) > 10)
							break;
					}
				}

				for (let item of model.plugins) {
					if (item.name.toSearch().indexOf(value) !== -1) {
						if (output.push({ id: 'plugin' + item.id, name: item.name, icon: item.icon }) > 10)
							break;
					}
				}

				output.quicksort('name');
				next(output);
			};
			opt.callback = function(selected) {
				if (selected.id.substring(0, 6) === 'plugin')
					exports.menu(selected);
				else
					exports.open(selected);
			};
			SETTER('spotlight/show', opt);
		};

	});
</script>
